<div class="page-container">

  <!-- Page Header -->
  <div class="page-header">
    <div>
      <div class="breadcrumb">
        <span>Members</span>
        <i class="fa-solid fa-chevron-right"></i>
        <span>Add Member</span>
      </div>

      <h1>Add New Member</h1>
      <p>Add a new member to your gym</p>
    </div>

    <button class="btn-back">
      <i class="fa-solid fa-arrow-left"></i>
      Back to Members
    </button>
  </div>


  <!-- Member Information -->
  <div class="form-card">

    <div class="card-header">
      <div class="section-icon">
        <i class="fa-solid fa-user"></i>
      </div>

      <div>
        <h3>Member Information</h3>
        <p>Enter the member's basic information</p>
      </div>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Full Name <span>*</span></label>
        <input
          type="text"
          placeholder="Enter full name"
        />
      </div>

      <div class="form-group">
        <label>Gender <span>*</span></label>

        <select>
          <option value="">Select gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date">
      </div>

      <div class="form-group">
        <label>Phone Number <span>*</span></label>
        <input
          type="text"
          placeholder="Enter phone number"
        />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          placeholder="Enter email address"
        />
      </div>

      <div class="form-group">
        <label>Address</label>
        <input
          type="text"
          placeholder="Enter address"
        />
      </div>

    </div>

  </div>


  <!-- Two Column Section -->
  <div class="two-column">

    <!-- Membership -->
    <div class="form-card">

      <div class="card-header">
        <div class="section-icon">
          <i class="fa-solid fa-id-card"></i>
        </div>

        <div>
          <h3>Membership Details</h3>
          <p>Select membership plan</p>
        </div>
      </div>

      <div class="form-group">
        <label>Membership Plan <span>*</span></label>

        <select>
          <option value="">Select membership</option>
          <option>Monthly Membership</option>
          <option>Quarterly Membership</option>
          <option>Half-Yearly Membership</option>
          <option>Yearly Membership</option>
        </select>
      </div>

      <div class="form-grid two">

        <div class="form-group">
          <label>Start Date <span>*</span></label>
          <input type="date">
        </div>

        <div class="form-group">
          <label>End Date</label>
          <input type="date">
        </div>

      </div>

    </div>


    <!-- Payment -->
    <div class="form-card">

      <div class="card-header">
        <div class="section-icon">
          <i class="fa-solid fa-wallet"></i>
        </div>

        <div>
          <h3>Payment Information</h3>
          <p>Enter payment details</p>
        </div>
      </div>

      <div class="form-group">
        <label>Amount <span>*</span></label>

        <div class="amount-input">
          <span>₹</span>
          <input
            type="number"
            placeholder="Enter amount"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Payment Method <span>*</span></label>

        <select>
          <option value="">Select payment method</option>
          <option>Cash</option>
          <option>UPI</option>
          <option>Card</option>
          <option>Bank Transfer</option>
        </select>
      </div>

    </div>

  </div>


  <!-- Emergency Contact -->
  <div class="form-card">

    <div class="card-header">
      <div class="section-icon">
        <i class="fa-solid fa-phone"></i>
      </div>

      <div>
        <h3>Emergency Contact</h3>
        <p>Contact details in case of emergency</p>
      </div>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Contact Name <span>*</span></label>

        <input
          type="text"
          placeholder="Enter contact name"
        />
      </div>

      <div class="form-group">
        <label>Relationship <span>*</span></label>

        <select>
          <option value="">Select relationship</option>
          <option>Father</option>
          <option>Mother</option>
          <option>Brother</option>
          <option>Sister</option>
          <option>Spouse</option>
          <option>Friend</option>
        </select>
      </div>

      <div class="form-group">
        <label>Phone Number <span>*</span></label>

        <input
          type="text"
          placeholder="Enter phone number"
        />
      </div>

    </div>

  </div>


  <!-- Actions -->
  <div class="form-actions">

    <button class="btn-cancel">
      Cancel
    </button>

    <button class="btn-primary">
      <i class="fa-solid fa-user-plus"></i>
      Add Member
    </button>

  </div>

</div>
